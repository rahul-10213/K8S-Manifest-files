---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: DEV
  template:
    metadata:
      labels:
        app: DEV

    spec:
      containers:
        - name: cont1
          image: rahulgangula/maven:appimage
          ports:
            - containerPort: 80

    #config map
          envFrom:
            - configMapRef:
                name: myconfig

    # Resources for creating pods
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

    #probes integration

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5


